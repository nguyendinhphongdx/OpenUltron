services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642" # gateway OpenAI-compatible API + health endpoint
      - "9119:9119" # web dashboard (chỉ hoạt động khi HERMES_DASHBOARD=1)
    volumes:
      - ./data:/opt/data # duy nhất — toàn bộ state (config/.env/memory/skills/session)
    environment:
      - HERMES_DASHBOARD=1
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
