name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: apps/api — lint, boundaries, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Module boundary guard (docs/conventions/01-backend-fastapi.md)
        run: uv run python scripts/check_module_boundaries.py
      - name: pytest (exit 5 = no tests collected yet, tolerated until tests/ exists)
        run: uv run pytest -q || [ "$?" -eq 5 ]

  web:
    name: apps/web — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ultron/web lint
      - run: pnpm --filter @ultron/web typecheck
      - run: pnpm --filter @ultron/web build
